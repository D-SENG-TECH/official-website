name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-i18n
      # pdfinfo reads the printed profile's page numbers (scripts/profile-toc.mjs); Chrome is preinstalled
      - run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build
        env:
          GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
        run: |
          export BUILD_VERSION=$(git describe --tags --always)
          export BUILD_COMMIT=$GITHUB_SHA
          # The -dev mirror repo serves the preview site
          if [[ "$GITHUB_REPOSITORY" == *-dev ]]; then export SITE_ENV=dev; fi
          npm run build
          # Measure each language's printed profile pages, then rebuild with the TOC page numbers
          node scripts/profile-toc.mjs
          npm run build
          if [[ "$SITE_ENV" == dev ]]; then printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
